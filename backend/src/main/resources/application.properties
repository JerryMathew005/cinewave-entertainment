spring.application.name=cinewave-backend

server.port=${PORT:8080}

# Database Configuration (supports local development & cloud deployment environment variables)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/cinewave_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:cinewave_user}
spring.datasource.password=${DATABASE_PASSWORD:cinewave_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT Security Configuration
cinewave.jwt.secret=${JWT_SECRET:CineWaveEntertainmentSuperSecureSecretKey2026WithMinimum256BitsLengthForHmacSHA256}
cinewave.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
cinewave.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000,http://localhost:4173}

# SLA Configuration (in minutes)
cinewave.sla.default-minutes=${SLA_DEFAULT_MINUTES:30}
cinewave.sla.warning-minutes=${SLA_WARNING_MINUTES:10}

# Transactional Mail Configuration
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
cinewave.mail.from=${MAIL_FROM:${SMTP_USERNAME:noreply@cinewave.com}}
cinewave.admin.email=${ADMIN_EMAIL:jerrymathew987@gmail.com}
cinewave.admin.password=${ADMIN_PASSWORD:}

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
