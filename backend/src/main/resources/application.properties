spring.application.name=cinewave-backend

server.port=${PORT:8080}

# Database Configuration (supports local development & cloud deployment environment variables)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/cinewave_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:cinewave_user}
spring.datasource.password=${DATABASE_PASSWORD:cinewave_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT Security Configuration
cinewave.jwt.secret=${JWT_SECRET:CineWaveEntertainmentSuperSecureSecretKey2026WithMinimum256BitsLengthForHmacSHA256}
cinewave.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
cinewave.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173,http://localhost:3000,http://localhost:4173}

# SLA Configuration (in minutes)
cinewave.sla.default-minutes=${SLA_DEFAULT_MINUTES:30}
cinewave.sla.warning-minutes=${SLA_WARNING_MINUTES:10}

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
